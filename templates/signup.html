<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Flavr</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand">
        <a href="{{ url_for('index') }}" class="brand-name">Flavr.</a>
        <p style="font-size:13px;color:var(--ink-muted);">Discover recipes you'll love</p>
      </div>

      <h1>Create your account</h1>
      <p class="auth-subtitle">Free forever. No credit card needed.</p>

      <form method="POST">
        <input type="text" name="username" placeholder="Your name" required>
        <input type="email" name="email" placeholder="Email address" required>
        <input type="password" name="password" placeholder="Create a password" required>
        <button type="submit" style="width:100%;margin-top:0.25rem;">Create account →</button>
      </form>

      <p>Already have an account? <a href="{{ url_for('login') }}">Log in here</a></p>
    </div>
  </div>
</body>
</html>
